<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#161616"><meta name="description" content="Explore and create Mandelbrot, Julia, and Burning Ship fractals."><title>Fractalia</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23161616'/%3E%3Cpath d='M18 50V22h25M18 32h18M18 22v-8h25' fill='none' stroke='%23e86c45' stroke-width='6'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body>
<svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="icon-crop" viewBox="0 0 24 24"><path d="M8 3H4v4m12-4h4v4M4 17v4h4m12-4v4h-4M9 8h6v8H9z"/></symbol>
<symbol id="icon-pan" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M6 9l-3 3 3 3m3 3 3 3 3-3m3-9 3 3-3 3"/></symbol>
<symbol id="icon-back" viewBox="0 0 24 24"><path d="m9 5-6 6 6 6m-6-6h11a6 6 0 0 1 0 12"/></symbol>
<symbol id="icon-export" viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M5 14v6h14v-6"/></symbol>
<symbol id="icon-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
<symbol id="icon-expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
<symbol id="icon-share" viewBox="0 0 24 24"><path d="m10 14 4-4m-5 7-2 2a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2-2 2-2a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0"/></symbol>
</defs></svg>
<header class="site-header">
<a href="#" class="brand" aria-label="Fractalia home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 26V11h15M9 17h11M9 11V6h15"/></svg><span>fractalia</span></a>
<div class="header-actions"><button id="exploreTab" class="icon-button explorer-tab" aria-label="Focus canvas" title="Focus canvas"><svg class="icon"><use href="#icon-crop"/></svg></button><button id="collectionBtn" title="Saved views">Library <span id="savedCount">0</span></button><span class="separator"></span><button id="saveBtn" title="Save this view"><svg class="icon"><use href="#icon-bookmark"/></svg><span>Save</span></button><button id="shareBtn" class="icon-button" aria-label="Copy view link" title="Copy view link"><svg class="icon"><use href="#icon-share"/></svg></button><button id="exportBtn" title="Export PNG"><svg class="icon"><use href="#icon-export"/></svg><span>PNG</span></button><span class="separator"></span><button id="aboutBtn" class="icon-button help-button" aria-label="Help" title="Help">?</button></div>
</header>
<main class="workspace" id="workspace">
<aside class="controls" id="controls" aria-label="Parameters">
<div class="parameter-section type-section"><label class="field-label" for="fractal">Fractal</label><select id="fractal"><option value="mandelbrot">Mandelbrot</option><option value="julia">Julia</option><option value="ship">Burning Ship</option><option value="studio" id="studioOption" hidden>Formula Studio</option></select><div class="formula" id="formula">z<sub>n+1</sub> = z<sub>n</sub>² + c</div><div class="studio-launch"><button id="studioBtn">Formula Studio</button></div></div>
<div class="parameter-section" id="juliaControls" hidden><div class="label-row"><label for="juliaRe">Re(c)</label><output id="jrValue">−0.745</output></div><input id="juliaRe" type="range" min="-1.5" max="1.5" step=".001" value="-.745"><div class="label-row"><label for="juliaIm">Im(c)</label><output id="jiValue">0.186</output></div><input id="juliaIm" type="range" min="-1.5" max="1.5" step=".001" value=".186"></div>
<div class="parameter-section detail-section"><div class="label-row"><label for="iterations">Iterations</label><output id="iterValue">600</output></div><input id="iterations" type="range" min="100" max="3000" step="100" value="600"><label class="switch-row"><span>Auto</span><input type="checkbox" id="autoDetail" checked title="Increase iterations automatically while zooming"><span class="switch"></span></label></div>
<div class="parameter-section color-section"><div class="label-row"><span id="paletteLabel">Palette</span><span id="paletteName" class="sr-only">Aurora</span></div><div class="palettes" role="group" aria-labelledby="paletteLabel"><button data-palette="aurora" class="swatch active aurora" title="Aurora" aria-label="Aurora" aria-pressed="true"></button><button data-palette="ember" class="swatch ember" title="Ember" aria-label="Ember" aria-pressed="false"></button><button data-palette="ocean" class="swatch ocean" title="Ocean" aria-label="Ocean" aria-pressed="false"></button><button data-palette="moss" class="swatch moss" title="Moss" aria-label="Moss" aria-pressed="false"></button><button data-palette="mono" class="swatch mono" title="Silver" aria-label="Silver" aria-pressed="false"></button></div><div class="label-row"><label for="colorShift">Phase</label><output id="shiftValue">0°</output></div><input id="colorShift" type="range" min="0" max="360" value="0"></div>
<div class="parameter-section presets-section"><span class="field-label">Presets</span><div class="destinations"><button class="destination" data-preset="seahorse" title="Seahorse Valley"><canvas data-thumb="seahorse" width="160" height="160" aria-hidden="true"></canvas><span>Valley</span></button><button class="destination" data-preset="julia" title="Julia’s Garden"><canvas data-thumb="julia" width="160" height="160" aria-hidden="true"></canvas><span>Julia</span></button><button class="destination" data-preset="ship" title="Burning Shores"><canvas data-thumb="ship" width="160" height="160" aria-hidden="true"></canvas><span>Ship</span></button></div><div id="presetCatalog" class="preset-catalog"></div></div>
<div class="panel-bottom"><button id="resetBtn" title="Reset the current fractal (Home)"><span>↺</span> Reset</button></div>
</aside>
<section class="explorer" aria-label="Fractal explorer">
<div class="viewport-frame" id="viewportFrame">
<div class="viewport-toolbar"><div class="canvas-tools" role="group" aria-label="Tools"><button id="settingsBtn" class="icon-button" aria-label="Toggle parameters" aria-expanded="true" aria-controls="controls" title="Parameters"><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16M8 3v6m8 0v6m-5 0v6"/></svg></button><span class="separator"></span><label class="switch-row navigation-switch" title="Drag to pan and scroll to zoom (H). Turn off for rectangle selection (V)."><span>Drag + scroll</span><input id="navigationMode" type="checkbox" role="switch" aria-controls="fractalCanvas"><span class="switch" aria-hidden="true"></span></label><span class="separator"></span><button id="undoSnip" class="icon-button" title="Undo region zoom" aria-label="Return to the view before selection" disabled><svg class="icon"><use href="#icon-back"/></svg></button></div><span id="viewName" class="view-name">Seahorse Valley</span><button id="fullscreenBtn" class="icon-button" title="Full screen" aria-label="Full screen"><svg class="icon"><use href="#icon-expand"/></svg></button></div>
<div class="canvas-shell" id="canvasShell" data-tool="select"><canvas id="fractalCanvas" tabindex="0" aria-describedby="interactionHint" aria-label="Fractal canvas"></canvas><span id="familyBadge" class="sr-only">MANDELBROT SET</span><div id="interactionHint" class="sr-only">Draw a rectangle to zoom. Hold Shift to pan. Escape cancels selection.</div><div class="frame-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="render-status" id="renderStatus" role="status"><i></i><span>Rendering</span></div><div id="selectionBox" class="selection-box" hidden aria-hidden="true"><i></i><i></i><i></i><i></i><span id="selectionLabel"></span></div><div class="zoom-control"><button id="zoomIn" aria-label="Zoom in" title="Zoom in (+)">+</button><span></span><button id="zoomOut" aria-label="Zoom out" title="Zoom out (−)">−</button></div><div class="canvas-loader" id="progress"></div></div>
<div class="telemetry"><div class="zoom-data"><span class="telemetry-label">Zoom</span><strong id="zoomReadout">275×</strong></div><button id="coordsBtn" title="Edit exact coordinates" aria-label="Edit coordinates"><span class="coordinate-label">Re / Im</span><span id="coordReadout">−0.7453 / +0.1127</span><span class="coord-edit">↗</span></button><div class="precision-data"><span class="telemetry-label">Precision</span><strong id="precisionReadout">40 dp</strong></div></div>
</div>
</section>
</main>
<div id="toast" role="status"></div><dialog id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="Close dialog">×</button></div><div id="modalBody"></div></dialog>
<link rel="stylesheet" href="studio.css"><script type="module" src="app.js"></script></body></html>
